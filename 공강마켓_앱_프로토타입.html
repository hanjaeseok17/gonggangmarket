<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html{color-scheme:light dark;}
  img{max-width:100%;}
</style>
<title>공강마켓 프로토타입</title>
<style>
  :root{
    --sky-50:#EAF6FE;
    --sky-100:#D6ECFB;
    --sky-200:#B6DEF8;
    --sky-500:#1F9FE5;
    --sky-600:#1385C6;
    --sky-700:#0C6796;
    --ink:#17212B;
    --ink-2:#3E4C59;
    --muted:#8494A2;
    --faint:#AEBAC5;
    --line:#EAEEF1;
    --line-2:#DCE3E8;
    --bg:#FFFFFF;
    --sub:#F6F8FA;
    --green:#12A55F;
    --green-soft:#E4F7EE;
    --red:#E0484D;
    --amber:#B4731A;
    --amber-soft:#FDF2E0;
    --shadow-sm:0 1px 2px rgba(23,33,43,.06);
    --shadow-md:0 6px 20px -8px rgba(23,33,43,.22);
    --shadow-lg:0 18px 48px -18px rgba(12,40,64,.42);
    --ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    --backdrop:#E4EBF0;
    --backdrop-ink:#485866;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --backdrop:#0F1519; --backdrop-ink:#7C8C99; }
  }
  :root[data-theme="dark"]{ --backdrop:#0F1519; --backdrop-ink:#7C8C99; }

  body{
    background:var(--backdrop);
    font-family:var(--ui);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:20px 12px 28px;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea,select{font-family:inherit;}

  .stage-note{
    color:var(--backdrop-ink);
    font-size:12.5px;
    text-align:center;
    line-height:1.6;
    max-width:420px;
  }
  .stage-note b{color:var(--backdrop-ink);font-weight:700;}

  /* ===== 기기 프레임 ===== */
  .phone{
    width:390px;
    height:min(844px, calc(100vh - 92px));
    background:var(--bg);
    border-radius:42px;
    box-shadow:var(--shadow-lg), 0 0 0 10px #1B242C, 0 0 0 11px #384654;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  @media (max-width:440px),(max-height:700px){
    body{padding:0;gap:0;justify-content:flex-start;}
    .phone{width:100%;height:100vh;border-radius:0;box-shadow:none;}
    .stage-note{display:none;}
  }

  .statusbar{
    height:44px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    font-size:13px;
    font-weight:700;
    letter-spacing:.02em;
    background:var(--bg);
    z-index:40;
  }
  .statusbar .icons{display:flex;gap:5px;align-items:center;font-size:11px;letter-spacing:-.04em;}

  .viewport{flex:1;position:relative;overflow:hidden;background:var(--bg);}
  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }
  .screen[hidden]{display:none !important;}
  .screen.push{animation:slideIn .22s cubic-bezier(.25,.8,.35,1);}
  @keyframes slideIn{from{transform:translateX(26px);opacity:.4;}to{transform:translateX(0);opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .screen.push{animation:none;} }

  /* ===== 헤더 ===== */
  .appbar{
    flex:none;
    height:52px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 6px 0 4px;
    border-bottom:1px solid var(--line);
    background:var(--bg);
  }
  .appbar .title{font-size:16.5px;font-weight:700;flex:1;padding-left:8px;}
  .appbar .title.center{text-align:center;padding-right:44px;}
  .iconbtn{
    width:44px;height:44px;
    display:grid;place-items:center;
    border-radius:50%;
    font-size:19px;
    color:var(--ink-2);
    flex:none;
  }
  .iconbtn:active{background:var(--sub);}
  .iconbtn.badge{position:relative;}
  .iconbtn.badge::after{
    content:"";position:absolute;top:10px;right:11px;
    width:7px;height:7px;border-radius:50%;background:var(--red);
    border:1.5px solid var(--bg);
  }

  .searchbar{
    flex:1;
    height:38px;
    background:var(--sub);
    border-radius:10px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 12px;
    font-size:14px;
    color:var(--muted);
    border:1px solid transparent;
  }
  .searchbar input{
    border:none;background:none;outline:none;
    font-size:14.5px;color:var(--ink);width:100%;
  }
  .searchbar input::placeholder{color:var(--faint);}

  .body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .body.pad{padding-bottom:20px;}

  /* ===== 카테고리 칩 ===== */
  .chips{
    display:flex;
    gap:7px;
    padding:11px 14px;
    overflow-x:auto;
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;
    padding:7px 13px;
    border-radius:999px;
    background:var(--sub);
    font-size:13.5px;
    font-weight:500;
    color:var(--ink-2);
    white-space:nowrap;
    border:1px solid transparent;
  }
  .chip[aria-pressed="true"]{background:var(--sky-500);color:#fff;font-weight:700;}

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 16px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
    color:var(--ink-2);
  }
  .toolbar button{display:flex;align-items:center;gap:4px;font-size:13.5px;color:var(--ink-2);font-weight:500;padding:4px 2px;}
  .toolbar .count{color:var(--muted);font-size:12.5px;}
  .fcount{
    background:var(--sky-500);color:#fff;font-size:10.5px;font-weight:700;
    min-width:16px;height:16px;border-radius:8px;display:inline-grid;place-items:center;padding:0 4px;
  }

  /* ===== 인증 배너 ===== */
  .banner{
    margin:12px 14px 2px;
    background:linear-gradient(135deg,var(--sky-50),var(--sky-100));
    border:1px solid var(--sky-200);
    border-radius:14px;
    padding:13px 15px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .banner .txt{flex:1;display:flex;flex-direction:column;gap:2px;}
  .banner .h{font-size:13.5px;font-weight:700;color:var(--sky-700);}
  .banner .s{font-size:12px;color:var(--sky-600);line-height:1.5;}
  .banner .go{
    flex:none;background:var(--sky-500);color:#fff;
    font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:9px;
  }

  /* ===== 매물 카드 ===== */
  .list{display:flex;flex-direction:column;}
  .card{
    display:flex;
    gap:13px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    text-align:left;
    width:100%;
    align-items:flex-start;
  }
  .card:active{background:var(--sub);}
  .thumb{
    width:92px;height:92px;flex:none;
    border-radius:11px;
    display:grid;place-items:center;
    font-size:36px;
    background:linear-gradient(145deg, hsl(var(--h) 72% 93%), hsl(var(--h) 58% 83%));
    position:relative;
    overflow:hidden;
  }
  .thumb.sold::before{
    content:"거래완료";
    position:absolute;inset:0;
    background:rgba(23,33,43,.62);
    color:#fff;font-size:12.5px;font-weight:700;
    display:grid;place-items:center;
    letter-spacing:.02em;
  }
  .card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:1px;}
  .card .t{
    font-size:14.5px;line-height:1.4;font-weight:500;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .m{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center;}
  .card .p{font-size:15.5px;font-weight:700;margin-top:2px;}
  .card .p.free{color:var(--green);}
  .card .foot{display:flex;align-items:center;gap:8px;margin-top:3px;}
  .card .likes{
    margin-left:auto;font-size:11.5px;color:var(--muted);
    display:flex;align-items:center;gap:3px;
  }
  .tag{
    font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.01em;
  }
  .tag.resv{background:var(--amber-soft);color:var(--amber);}
  .tag.free{background:var(--green-soft);color:var(--green);}
  .tag.done{background:var(--sub);color:var(--muted);}

  /* ===== 빈 화면 / 로딩 ===== */
  .empty{
    padding:64px 32px;
    display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
  }
  .empty .ic{font-size:38px;opacity:.5;}
  .empty .h{font-size:14.5px;font-weight:700;}
  .empty .s{font-size:13px;color:var(--muted);line-height:1.6;}
  .empty .act{
    margin-top:8px;background:var(--sky-500);color:#fff;
    font-size:13.5px;font-weight:700;padding:10px 18px;border-radius:10px;
  }
  .skel{padding:14px 16px;display:flex;gap:13px;border-bottom:1px solid var(--line);}
  .skel .a{width:92px;height:92px;border-radius:11px;flex:none;}
  .skel .b{flex:1;display:flex;flex-direction:column;gap:8px;padding-top:4px;}
  .sh{background:linear-gradient(90deg,var(--sub) 25%,#EDF1F4 37%,var(--sub) 63%);
    background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:5px;}
  @keyframes sh{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

  /* ===== 상세 ===== */
  .carousel{
    display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  }
  .carousel::-webkit-scrollbar{display:none;}
  .carousel .slide{
    flex:none;width:100%;aspect-ratio:4/3;scroll-snap-align:center;
    display:grid;place-items:center;font-size:88px;
    background:linear-gradient(145deg, hsl(var(--h) 72% 94%), hsl(var(--h) 55% 82%));
  }
  .dots{display:flex;gap:5px;justify-content:center;padding:10px 0 2px;}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2);display:block;}
  .dots i.on{background:var(--sky-500);width:16px;border-radius:3px;}

  .seller{
    display:flex;align-items:center;gap:11px;padding:14px 16px;
    border-bottom:1px solid var(--line);width:100%;text-align:left;
  }
  .avatar{
    width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:18px;background:var(--sky-50);color:var(--sky-600);font-weight:700;
  }
  .seller .n{font-size:14.5px;font-weight:700;}
  .seller .c{font-size:12px;color:var(--muted);}
  .trust{margin-left:auto;text-align:right;}
  .trust .v{font-size:15px;font-weight:700;color:var(--sky-600);}
  .trust .l{font-size:10.5px;color:var(--muted);}

  .sect{padding:16px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--line);}
  .sect h4{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.03em;}
  .detail-title{font-size:19px;font-weight:700;line-height:1.35;}
  .detail-meta{font-size:12.5px;color:var(--muted);}
  .detail-price{font-size:23px;font-weight:700;}
  .detail-price.free{color:var(--green);}
  .desc{font-size:14.5px;line-height:1.75;color:var(--ink-2);white-space:pre-wrap;}
  .places{display:flex;gap:7px;flex-wrap:wrap;}
  .place{
    background:var(--sky-50);color:var(--sky-700);
    font-size:12.5px;font-weight:500;padding:7px 11px;border-radius:8px;
    display:flex;gap:5px;align-items:center;
  }
  .notice{
    background:var(--sub);border-radius:10px;padding:12px 14px;
    font-size:12px;color:var(--muted);line-height:1.65;
  }
  .kv{display:flex;gap:10px;font-size:13.5px;}
  .kv .k{color:var(--muted);min-width:64px;flex:none;}
  .kv .v{color:var(--ink-2);}

  .bottombar{
    flex:none;border-top:1px solid var(--line);background:var(--bg);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:12px;
  }
  .likebtn{
    width:46px;height:46px;flex:none;display:grid;place-items:center;
    font-size:23px;border-radius:11px;border:1px solid var(--line-2);
  }
  .likebtn[aria-pressed="true"]{border-color:#F7C6C8;background:#FEF1F1;}
  .cta{
    flex:1;height:46px;border-radius:11px;background:var(--sky-500);color:#fff;
    font-size:15px;font-weight:700;display:grid;place-items:center;
  }
  .cta:active{background:var(--sky-600);}
  .cta.ghost{background:var(--sub);color:var(--ink-2);}
  .cta[disabled]{background:var(--line-2);color:#fff;}

  /* ===== 탭바 ===== */
  .tabbar{
    flex:none;display:flex;border-top:1px solid var(--line);background:var(--bg);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:10.5px;color:var(--faint);font-weight:500;position:relative;
  }
  .tabbar button .ic{font-size:21px;line-height:1;filter:grayscale(1);opacity:.55;}
  .tabbar button[aria-selected="true"]{color:var(--sky-600);font-weight:700;}
  .tabbar button[aria-selected="true"] .ic{filter:none;opacity:1;}
  .tabbar .dot{
    position:absolute;top:6px;left:calc(50% + 8px);
    width:7px;height:7px;border-radius:50%;background:var(--red);
  }

  /* ===== 폼 ===== */
  .field{padding:15px 16px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--line);}
  .field label{font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;gap:4px;}
  .field label .req{color:var(--sky-500);}
  .field input[type="text"],.field input[type="number"],.field textarea,.field select{
    width:100%;border:none;outline:none;font-size:15px;color:var(--ink);
    background:none;padding:2px 0;resize:none;
  }
  .field input::placeholder,.field textarea::placeholder{color:var(--faint);}
  .field .hint{font-size:11.5px;color:var(--muted);line-height:1.55;}
  .field .err{font-size:11.5px;color:var(--red);font-weight:500;}
  .photos{display:flex;gap:9px;overflow-x:auto;padding:2px 0;scrollbar-width:none;}
  .photos::-webkit-scrollbar{display:none;}
  .photo-add{
    width:74px;height:74px;flex:none;border-radius:11px;border:1px dashed var(--line-2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:19px;color:var(--muted);
  }
  .photo-add span{font-size:10.5px;}
  .photo{
    width:74px;height:74px;flex:none;border-radius:11px;display:grid;place-items:center;
    font-size:30px;position:relative;
    background:linear-gradient(145deg, hsl(var(--h) 72% 93%), hsl(var(--h) 58% 83%));
  }
  .photo .x{
    position:absolute;top:-5px;right:-5px;width:21px;height:21px;border-radius:50%;
    background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center;
  }
  .photo .rep{
    position:absolute;bottom:0;left:0;right:0;background:rgba(23,33,43,.6);color:#fff;
    font-size:9.5px;text-align:center;padding:2px 0;border-radius:0 0 11px 11px;
  }
  .segmented{display:flex;gap:7px;flex-wrap:wrap;}
  .seg{
    padding:9px 14px;border-radius:9px;background:var(--sub);
    font-size:13.5px;color:var(--ink-2);font-weight:500;border:1px solid transparent;
  }
  .seg[aria-pressed="true"]{background:var(--sky-50);border-color:var(--sky-500);color:var(--sky-700);font-weight:700;}
  .switch{
    width:46px;height:27px;border-radius:14px;background:var(--line-2);
    position:relative;flex:none;transition:background .16s;
  }
  .switch::after{
    content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
    background:#fff;box-shadow:var(--shadow-sm);transition:transform .16s;
  }
  .switch[aria-checked="true"]{background:var(--sky-500);}
  .switch[aria-checked="true"]::after{transform:translateX(19px);}
  .rowline{
    display:flex;align-items:center;gap:12px;padding:14px 16px;
    border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:14.5px;
  }
  .rowline:active{background:var(--sub);}
  .rowline .sub{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;}

  /* ===== 채팅 ===== */
  .chatlist .row{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:center;}
  .chatlist .row:active{background:var(--sub);}
  .chatlist .msg{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chatlist .top{display:flex;align-items:baseline;gap:6px;}
  .chatlist .nm{font-size:14.5px;font-weight:700;}
  .chatlist .tm{font-size:11.5px;color:var(--faint);margin-left:auto;flex:none;}
  .unread{
    background:var(--sky-500);color:#fff;font-size:10.5px;font-weight:700;
    min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;flex:none;
  }
  .itembar{
    display:flex;align-items:center;gap:11px;padding:10px 14px;
    background:var(--sub);border-bottom:1px solid var(--line);
  }
  .itembar .th{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;font-size:20px;flex:none;
    background:linear-gradient(145deg, hsl(var(--h) 72% 93%), hsl(var(--h) 58% 83%));}
  .itembar .t{font-size:13px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .itembar .p{font-size:14px;font-weight:700;}
  .itembar .act{margin-left:auto;flex:none;background:var(--bg);border:1px solid var(--line-2);
    font-size:12px;font-weight:700;padding:7px 11px;border-radius:8px;color:var(--ink-2);}

  .msgs{flex:1;overflow-y:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:9px;background:var(--bg);}
  .bubble{max-width:74%;display:flex;flex-direction:column;gap:3px;}
  .bubble .b{
    padding:9px 13px;border-radius:15px;font-size:14.5px;line-height:1.5;
    background:var(--sub);color:var(--ink);border-bottom-left-radius:4px;white-space:pre-wrap;
  }
  .bubble .tm{font-size:10.5px;color:var(--faint);padding:0 3px;}
  .bubble.me{align-self:flex-end;align-items:flex-end;}
  .bubble.me .b{background:var(--sky-500);color:#fff;border-bottom-left-radius:15px;border-bottom-right-radius:4px;}
  .sysmsg{
    align-self:center;font-size:11.5px;color:var(--muted);background:var(--sub);
    padding:6px 12px;border-radius:999px;text-align:center;max-width:85%;line-height:1.5;
  }
  .warnmsg{
    align-self:center;font-size:11.5px;color:var(--amber);background:var(--amber-soft);
    padding:8px 13px;border-radius:10px;text-align:center;max-width:90%;line-height:1.55;font-weight:500;
  }
  .typing .b{color:var(--muted);letter-spacing:2px;}
  .quick{display:flex;gap:7px;padding:8px 12px 0;overflow-x:auto;scrollbar-width:none;flex:none;}
  .quick::-webkit-scrollbar{display:none;}
  .quick button{
    flex:none;border:1px solid var(--sky-200);background:var(--sky-50);color:var(--sky-700);
    font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:999px;white-space:nowrap;
  }
  .composer{
    flex:none;display:flex;gap:9px;align-items:flex-end;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--bg);
  }
  .composer .box{
    flex:1;background:var(--sub);border-radius:19px;padding:9px 14px;
    display:flex;align-items:center;
  }
  .composer input{border:none;background:none;outline:none;width:100%;font-size:14.5px;}
  .send{
    width:38px;height:38px;flex:none;border-radius:50%;background:var(--sky-500);color:#fff;
    display:grid;place-items:center;font-size:16px;
  }
  .send[disabled]{background:var(--line-2);}

  /* ===== 프로필 / 내 정보 ===== */

  /* ===================== 유틸 ===================== */
  var vp = document.getElementById("viewport");
  var tabbar = document.getElementById("tabbar");
  var scrim = document.getElementById("scrim");
  var toastEl = document.getElementById("toast");

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function won(n){ return n === 0 ? "나눔" : n.toLocaleString("ko-KR") + "원"; }
  function ago(m){
    if (m < 1) return "방금 전";
    if (m < 60) return m + "분 전";
    if (m < 1440) return Math.floor(m/60) + "시간 전";
    var d = Math.floor(m/1440);
    return d < 8 ? d + "일 전" : "9월 " + (23 - Math.min(d,20)) + "일";
  }
  function item(id){ for(var i=0;i<S.items.length;i++) if(S.items[i].id===id) return S.items[i]; return null; }
  function chat(id){ for(var i=0;i<S.chats.length;i++) if(S.chats[i].id===id) return S.chats[i]; return null; }
  function unreadTotal(){ var n=0; S.chats.forEach(function(c){ n += c.unread; }); return n; }

  var toastTimer = null;
  function toast(msg, actionLabel, action){
    toastEl.innerHTML = "<span>" + esc(msg) + "</span>" +
      (actionLabel ? '<button type="button" id="toast-act">' + esc(actionLabel) + "</button>" : "");
    toastEl.hidden = false;
    if (actionLabel){
      document.getElementById("toast-act").onclick = function(){ toastEl.hidden = true; if(action) action(); };
    }
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.hidden = true; }, 2600);
  }

  function closeOverlay(){ scrim.hidden = true; scrim.innerHTML = ""; }
  scrim.addEventListener("click", function(e){ if (e.target === scrim) closeOverlay(); });

  function sheet(html){
    scrim.className = "scrim";
    scrim.innerHTML = '<div class="sheet"><div class="grab"></div>' + html + "</div>";
    scrim.hidden = false;
  }
  function dialog(title, body, yes, onYes, danger){
    scrim.className = "scrim center";
    scrim.innerHTML =
      '<div class="dialog"><h3>' + esc(title) + "</h3><p>" + esc(body) + "</p>" +
      '<div class="acts"><button type="button" class="no" data-x>취소</button>' +
      '<button type="button" class="yes' + (danger ? " danger" : "") + '" data-y>' + esc(yes) + "</button></div></div>";
    scrim.hidden = false;
    scrim.querySelector("[data-x]").onclick = closeOverlay;
    scrim.querySelector("[data-y]").onclick = function(){ closeOverlay(); onYes(); };
  }

  /* ===================== 네비게이션 ===================== */
  function go(name, param){
    S.stack.push({name:name, param:param});
    render();
  }
  function back(){
    S.stack.pop();
    render();
  }
  function switchTab(t){
    S.tab = t; S.stack = [];

  function current(){
    return S.stack.length ? S.stack[S.stack.length-1] : {name:"tab:"+S.tab};
  }

  /* ===================== 공통 조각 ===================== */
  function appbar(title, opts){
    opts = opts || {};
    return '<div class="appbar">' +
      (opts.back !== false ? '<button class="iconbtn" data-act="back" aria-label="뒤로">‹</button>' : '<span style="width:8px"></span>') +
      '<div class="title' + (opts.center ? " center" : "") + '">' + esc(title) + "</div>" +
      (opts.right || "") + "</div>";
  }

  function cardHTML(it){
    var c = cat(it.cat), liked = !!S.likes[it.id];
    var tag = it.status === "resv" ? '<span class="tag resv">예약중</span>' :
              it.status === "done" ? '<span class="tag done">거래완료</span>' :
              it.price === 0 ? '<span class="tag free">나눔</span>' : "";
    return '<button class="card" data-act="item" data-id="' + it.id + '">' +
      '<div class="thumb' + (it.status==="done" ? " sold" : "") + '" style="--h:' + c.h + '">' + it.emo + "</div>" +
      '<div class="info">' +
        '<div class="t">' + esc(it.title) + "</div>" +
        '<div class="m">' + esc(it.places[0]) + " · " + ago(it.mins) + "</div>" +
        '<div class="p' + (it.price===0 ? " free" : "") + '">' + won(it.price) + "</div>" +
        '<div class="foot">' + tag +
          '<span class="likes">' + (liked ? "❤️" : "🤍") + " " + (it.likes + (liked?1:0)) + "</span>" +
        "</div>" +
      "</div></button>";
  }

  function filtered(){
    var f = S.filter;
    var out = S.items.filter(function(it){
      if (f.cat !== "all" && it.cat !== f.cat) return false;
      if (f.freeOnly && it.price !== 0) return false;
      if (f.maxPrice && it.price > f.maxPrice) return false;
      if (f.q){
        var hay = (it.title + " " + it.desc + " " + (it.meta ? Object.keys(it.meta).map(function(k){return it.meta[k];}).join(" ") : "")).toLowerCase();
        if (hay.indexOf(f.q.toLowerCase()) === -1) return false;
      }
      return true;
    });
    if (f.sort === "low") out.sort(function(a,b){ return a.price - b.price; });
    else if (f.sort === "like") out.sort(function(a,b){ return b.likes - a.likes; });
    else out.sort(function(a,b){ return a.mins - b.mins; });
    /* 거래완료는 목록 맨 뒤로 (FR-FIND-05) */
    out.sort(function(a,b){ return (a.status==="done"?1:0) - (b.status==="done"?1:0); });
    return out;
  }

  function activeFilters(){
    var n = 0;
    if (S.filter.cat !== "all") n++;
    if (S.filter.freeOnly) n++;
    if (S.filter.maxPrice) n++;
    return n;
  }

  function render(){

    if (cur.name === "tab:home") html = screenHome();
    else if (cur.name === "tab:sell") html = screenRegister();
    else if (cur.name === "tab:chats") html = screenChats();
    else if (cur.name === "tab:me") html = screenMe();
    else if (cur.name === "search") html = screenSearch();
    else if (cur.name === "detail") html = screenDetail(cur.param);
    else if (cur.name === "verify") html = screenVerify();
    else if (cur.name === "card") html = screenCard();
    else if (cur.name === "room") html = screenRoom(cur.param);
    else if (cur.name === "profile") html = screenProfile(cur.param);
    else if (cur.name === "settings") html = screenSettings();
    else if (cur.name === "credits") html = screenCredits();
    else if (cur.name === "myitems") html = screenList("내 매물", S.items.filter(function(i){return i.seller==="me";}), "아직 올린 물건이 없어요");

    vp.innerHTML = '<div class="screen' + (S.stack.length ? " push" : "") + '">' + html + "</div>";
    renderTabs();
    afterRender(cur);

    var un = unreadTotal();
    var tabs = [
      {id:"home",  ic:"🏠", label:"홈"},
      {id:"sell",  ic:"➕", label:"등록"},
      {id:"chats", ic:"💬", label:"채팅", dot:un > 0},
      {id:"me",    ic:"👤", label:"내 정보"}
    ];
    tabbar.innerHTML = tabs.map(function(t){
      return '<button data-tab="' + t.id + '" aria-selected="' + (S.tab===t.id && !S.stack.length) + '">' +
        '<span class="ic">' + t.ic + "</span>" + (t.dot ? '<span class="dot"></span>' : "") +
        "<span>" + t.label + "</span></button>";
    }).join("");
  }

  function afterRender(cur){
    if (cur.name === "room"){
      var m = document.getElementById("msgs");
      if (m) m.scrollTop = m.scrollHeight;
      var inp = document.getElementById("msg");
      if (inp){
        inp.addEventListener("keydown", function(e){ if (e.key === "Enter") sendMsg(); });
      }
    }
    if (cur.name === "search"){
      var q = document.getElementById("q");
      if (q){
        q.focus();
        q.addEventListener("keydown", function(e){
          if (e.key === "Enter"){ S.filter.q = q.value.trim(); pushRecent(S.filter.q); render(); }
        });
      }
    }
    if (cur.name === "detail"){
      var car = document.getElementById("car"), dots = document.getElementById("dots");
      if (car && dots){
        car.addEventListener("scroll", function(){
          var i = Math.round(car.scrollLeft / car.clientWidth);
          [].forEach.call(dots.children, function(d, n){ d.className = n === i ? "on" : ""; });
        });
      }
    }
    /* 등록 폼 입력은 상태에 즉시 반영 — 리렌더로 값이 날아가지 않게 */
    bindDraft("f-title", "title");
    bindDraft("f-price", "price");
    bindDraft("f-desc", "desc");
    bindMeta("f-course", "과목명");
    bindMeta("f-prof", "교수명");
  }
  function bindDraft(id, key){
    var el = document.getElementById(id);
    if (!el || !S.draft) return;
    el.addEventListener("input", function(){
      S.draft[key] = el.value;
      var btn = document.querySelector('[data-act="submit"]');
      if (btn) btn.disabled = !draftOK();
      var hint = el.parentNode.querySelector(".hint");
      if (id === "f-title" && hint) hint.textContent = el.value.length + "/40";
    });
  }
  function bindMeta(id, key){
    var el = document.getElementById(id);
    if (!el || !S.draft) return;
    el.addEventListener("input", function(){ S.draft.meta[key] = el.value; });
  }
  function draftOK(){
    var d = S.draft;
    return !!(d && d.photos.length && d.cat && d.title.trim().length >= 2 && d.places.length && (d.free || String(d.price).length));
  }
  function pushRecent(q){
    if (!q) return;
    S.recent = [q].concat(S.recent.filter(function(r){ return r !== q; })).slice(0,10);
  }

  /* ===================== 채팅 동작 ===================== */
  function openChat(itemId){
    var it = item(itemId);
    var found = null;
    S.chats.forEach(function(c){ if (c.itemId === itemId) found = c; });
    if (!found){
      found = {id:"c"+(S.chats.length+1), itemId:itemId, withId:it.seller, unread:0, msgs:[
        {sys:true, t:"대화가 시작됐어요. 만나서 물건을 확인하고 거래하세요.", m:0}
      ]};
      S.chats.unshift(found);
    }
    S.tab = "chats"; S.stack = [{name:"room", param:found.id}];
    render();
  }

  function sendMsg(text){
    var cur = current();
    if (cur.name !== "room") return;
    var c = chat(cur.param);
    var inp = document.getElementById("msg");
    var t = (text !== undefined ? text : (inp ? inp.value : "")).trim();
    if (!t) return;

    c.msgs.push({me:true, t:t, m:0});
    /* 선입금 유도 문구 감지 (SC-10) */
    if (/계좌|입금|송금|선입금/.test(t)){
      c.msgs.push({warn:true, t:"만나서 물건을 확인하기 전에 돈을 보내지 마세요."});
    }
    if (inp) inp.value = "";
    render();

    var typing = setTimeout(function(){
      c.msgs.push({typing:true, me:false, t:"···", m:0});
      render();
    }, 400);

    setTimeout(function(){
      clearTimeout(typing);
      c.msgs = c.msgs.filter(function(m){ return !m.typing; });
      c.msgs.push({me:false, t:REPLIES[Math.floor(Math.random()*REPLIES.length)], m:0});
      if (current().name === "room" && current().param === c.id) render();
      else { c.unread++; renderTabs(); }
    }, 1500);
  }

      sheet("<h3>얼마를 제안할까요?</h3>" +
        '<div class="sect2">' +
          '<div style="font-size:13px;color:var(--muted)">판매 희망가 <b style="color:var(--ink)">' + won(it.price) + "</b></div>" +
          '<div class="segmented">' + sug.map(function(v){
            return '<button class="seg" data-act="sug" data-v="' + v + '">' + v.toLocaleString("ko-KR") + "원</button>";
          }).join("") + "</div>" +
          '<div class="field" style="padding:12px 14px;border:1px solid var(--line-2);border-radius:11px">' +
            '<label>제안 금액</label>' +
            '<div style="display:flex;align-items:center;gap:8px">' +
              '<input type="number" id="op" placeholder="0" style="flex:1"><span style="color:var(--muted)">원</span></div>' +
          "</div>" +
          '<div class="field" style="padding:12px 14px;border:1px solid var(--line-2);border-radius:11px">' +
            '<label>메시지 <span style="color:var(--muted);font-weight:400">선택</span></label>' +
            '<input type="text" id="om" maxlength="40" placeholder="예) 오늘 바로 가져갈 수 있어요"></div>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink-2)">' +
            "<span>보내는 비용</span><span class='credit-chip' style='background:var(--green-soft);color:var(--green)'>무료</span></div>" +
          '<div style="display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted)">' +
            "<span>거래가 성사되면</span><span>" + OFFER_COST + "크레딧 · 남은 크레딧 " + S.credits.toLocaleString("ko-KR") + "</span></div>" +
          '<button class="cta" data-act="sendoffer">제안 보내기</button>' +
          '<div style="font-size:11.5px;color:var(--muted);line-height:1.6">보낼 때는 크레딧이 들지 않아요. ' +
            "판매자가 수락해서 거래가 정해지면 그때 " + OFFER_COST + "크레딧을 받아요. 거절되면 내지 않아요.</div>" +
        "</div>");
      setTimeout(function(){ var o = document.getElementById("op"); if (o) o.focus(); }, 60);
    },
    sug: function(el){
      var o = document.getElementById("op");
      if (o) o.value = el.getAttribute("data-v");
      [].forEach.call(document.querySelectorAll('[data-act="sug"]'), function(b){
        b.setAttribute("aria-pressed", b === el);
      });
    },
    tocredits: function(){ closeOverlay(); go("credits"); },
    sendoffer: function(){
      var it = item(current().param);
      var o = document.getElementById("op"), m = document.getElementById("om");
      var price = parseInt(o ? o.value : "", 10);
      if (!price || price < 100){ toast("제안할 금액을 입력해 주세요."); return; }
      if (price >= it.price){ toast("판매 희망가보다 낮은 금액만 제안할 수 있어요."); return; }

      closeOverlay();

      var c = null;
      S.chats.forEach(function(x){ if (x.itemId === it.id) c = x; });
      if (!c){
        c = {id:"c"+(S.chats.length+1)+Date.now(), itemId:it.id, withId:it.seller, unread:0, msgs:[]};
        S.chats.unshift(c);
      }
      c.msgs.push({me:true, t:"가격 제안 · " + price.toLocaleString("ko-KR") + "원" + (m && m.value.trim() ? "\n" + m.value.trim() : ""), m:0});
      c.msgs.push({sys:true, t:"가격 제안을 보냈어요 · 수락되면 " + OFFER_COST + "크레딧을 받아요"});

      S.tab = "chats"; S.stack = [{name:"room", param:c.id}];
      render();
      toast("제안을 보냈어요. 보내는 건 무료예요.");

      /* 판매 희망가의 85% 이상이면 받아준다 */
      setTimeout(function(){
        if (price >= it.price * 0.85){
          c.msgs.push({me:false, t:"좋아요, 그 가격에 드릴게요!", m:0});
          c.msgs.push({sys:true, t:"판매자가 제안을 수락했어요 · " + price.toLocaleString("ko-KR") + "원"});
          it.status = "resv"; it.price = price;
          var short = chargeDeal(it.title.slice(0,14));
          c.msgs.push({sys:true, t:"거래가 정해져서 " + OFFER_COST + "크레딧을 받았어요. 물건값은 만나서 직접 주고받으세요."});
          setTimeout(function(){
            toast(short
              ? "크레딧이 모자라 " + short + "크레딧이 미납으로 남았어요."
              : OFFER_COST + "크레딧을 냈어요. 남은 크레딧 " + S.credits + "크레딧");
          }, 300);
        } else {
          c.msgs.push({me:false, t:"죄송해요, 그 가격은 조금 어려울 것 같아요 🥲", m:0});
          c.msgs.push({sys:true, t:"판매자가 제안을 거절했어요"});
        }
        if (current().name === "room" && current().param === c.id) render();
        else { c.unread++; renderTabs(); }
      }, 1800);
    },
    acceptoffer: function(el){
      var id = el.getAttribute("data-id"), o = null;
      S.offers.forEach(function(x){ if (x.id === id) o = x; });
      closeOverlay();
      dialog("제안을 받아들일까요?", seller(o.from).nick + "님의 " + won(o.price) + " 제안을 수락하면 매물이 예약중으로 바뀌어요. 수수료는 제안한 사람이 내요.", "수락", function(){
        o.status = "accepted";
        S.offers.forEach(function(x){ if (x.itemId === o.itemId && x.status === "pending") x.status = "rejected"; });
        var it = item(o.itemId);
        it.status = "resv"; it.price = o.price;
        render();
        toast("제안을 수락했어요. 채팅으로 약속을 잡아보세요.");
      });
    },
    rejectoffer: function(el){
      var id = el.getAttribute("data-id");
      S.offers.forEach(function(x){ if (x.id === id) x.status = "rejected"; });
      render();
      toast("제안을 거절했어요");
    },

    /* --- 크레딧 · 결제 --- */
    credits: function(){ go("credits"); },
    pickpack: function(el){ S.packSel = el.getAttribute("data-v"); render(); },
    pay: function(){
      var sel = S.packSel || "p1", p = null;
      PACKS.forEach(function(x){ if (x.id === sel) p = x; });
      sheet("<h3>결제하기</h3>" +
        '<div class="sect2">' +
          '<div style="display:flex;justify-content:space-between;font-size:14.5px">' +
            "<span>" + (p.credits + p.bonus).toLocaleString("ko-KR") + "크레딧</span>" +
            "<b>" + p.won.toLocaleString("ko-KR") + "원</b></div>" +
          (p.bonus ? '<div style="font-size:12.5px;color:var(--green);font-weight:500">보너스 ' +
            p.bonus.toLocaleString("ko-KR") + "크레딧 포함</div>" : "") +
          '<div style="font-size:12.5px;color:var(--muted);font-weight:700;margin-top:6px">결제 수단</div>' +
          '<button class="pack" data-act="pm" data-v="card" aria-pressed="true" style="margin:0">' +
            '<span style="font-size:20px">💳</span><div class="c"><div class="n" style="font-size:14px">카드 간편결제</div>' +
            '<div style="font-size:12px;color:var(--muted)">등록된 카드로 바로 결제</div></div></button>' +
          '<button class="pack" data-act="pm" data-v="store" aria-pressed="false" style="margin:0">' +
            '<span style="font-size:20px">🏬</span><div class="c"><div class="n" style="font-size:14px">앱스토어 인앱결제</div>' +
            '<div style="font-size:12px;color:var(--muted)">App Store · Google Play 계정으로 결제</div></div></button>' +
          '<button class="cta" data-act="dopay">' + p.won.toLocaleString("ko-KR") + "원 결제하기</button>" +
          '<div style="font-size:11.5px;color:var(--muted);line-height:1.6">데모라서 실제 결제는 일어나지 않아요. ' +
            "쓰지 않은 크레딧은 7일 안에 청약철회로 환불받을 수 있어요.</div>" +
        "</div>");
    },
    pm: function(el){
      [].forEach.call(document.querySelectorAll('[data-act="pm"]'), function(b){
        b.setAttribute("aria-pressed", String(b === el));
      });
    },
    dopay: function(){
      var sel = S.packSel || "p1", p = null;
      PACKS.forEach(function(x){ if (x.id === sel) p = x; });
      closeOverlay();
      toast("결제하고 있어요…");
      setTimeout(function(){
        var total = p.credits + p.bonus;
        S.credits += total;
        S.creditLog.unshift({t:"크레딧 충전 · " + p.won.toLocaleString("ko-KR") + "원", n:total, m:0});
        var paid = settleDebt();
        render();
        toast(total.toLocaleString("ko-KR") + "크레딧을 충전했어요" + (paid ? " · 미납 " + paid + "크레딧 정산" : ""));
      }, 1100);
    },

    /* --- 내 정보 --- */
    myitems: function(){ go("myitems"); },
    favs: function(){ go("favs"); },
    reviews: function(){ go("reviews"); },
    settings: function(){ go("settings"); },
    toggle: function(el){
      var on = el.getAttribute("aria-checked") === "true";
      el.setAttribute("aria-checked", String(!on));
    },
    logout: function(){
      dialog("로그아웃할까요?", "데모에서는 처음 상태로 돌아가요.", "로그아웃", function(){
        S.verify = 0; S.reviewing = false; S.likes = {}; switchTab("home");
        toast("로그아웃했어요");
      }, true);
    }
  };

  /* ===================== 이벤트 ===================== */
  document.getElementById("phone").addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("[data-act],[data-tab]") : null;
    if (!el) return;
    var tab = el.getAttribute("data-tab");
    if (tab){ switchTab(tab); return; }
    var act = el.getAttribute("data-act");
    if (ACTS[act]) ACTS[act](el);
  });

  function tick(){
    var d = new Date();
    document.getElementById("clock").textContent =
      d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0");
  }
  tick(); setInterval(tick, 20000);

  render();
  setTimeout(function(){
    toast("가상 데이터로 만든 시제품이에요. 마음껏 눌러보세요.");
  }, 700);
})();
</script>
</body>
</html>
